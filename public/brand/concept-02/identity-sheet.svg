<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1540" viewBox="0 0 1440 1540" role="img" aria-label="Recallo Held quotation identity sheet"><title>Recallo Held quotation identity sheet</title><desc></desc><path fill="#F3F8EF" d="M0 0H1440V1540H0Z"/><text x="56" y="66" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="600" fill="#2C3E2D">02 / Held quotation</text><text x="56" y="103" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Conversation → memory</text><text x="56" y="145" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#2C3E2D">Two spoken fragments settle onto a single retained line.</text><rect x="56" y="184" width="1328" height="220" rx="12" fill="#E6EEDF"/><g transform="translate(210 204) scale(1.5620453605721374)"><g transform="translate(0 -4)"><path fill="#2C3E2D" fill-rule="evenodd" d="M18 18H54V50C54 70 45 82 32 94H110V114H18V80C30 72 34 64 34 54H18Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M74 18H110V50C110 65 103 76 91 82H71V64C83 62 90 58 90 54H74Z"/></g><g transform="translate(180 8)"><g transform="scale(1.015 1)"><g transform="translate(0 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M0 100V0H35C59 0 72 13 72 32C72 47 64 57 51 61L76 100H58L34 64H12V100Z M12 13V51H33C49 51 57 45 57 32C57 19 49 13 33 13Z"/></g><g transform="translate(88 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M67 69H12C16 82 24 89 37 89C47 89 53 86 59 80L67 90C59 98 49 102 36 102C13 102 0 87 0 64C0 42 14 27 35 27C55 27 67 41 67 62Z M12 57H53C51 45 45 39 35 39C24 39 17 46 12 57Z"/></g><g transform="translate(166 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M65 40L53 50C49 43 43 40 35 40C22 40 12 49 12 64C12 80 22 89 35 89C43 89 49 85 53 78L65 87C58 97 48 102 34 102C13 102 0 87 0 64C0 42 14 27 35 27C48 27 59 32 65 40Z"/></g><g transform="translate(242 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M52 100V91C46 98 38 102 28 102C10 102 0 89 0 65C0 42 12 27 30