9 52 65C52 50 44 40 32 40C21 40 12 49 12 65Z"/></g><g transform="translate(320 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M0 0H12V80C12 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(358 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M0 0H12V80C12 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(396 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M0 64C0 42 14 27 35 27C56 27 70 42 70 64C70 87 56 102 35 102C14 102 0 87 0 64Z M12 64C12 80 22 89 35 89C48 89 58 80 58 64C58 49 48 40 35 40C22 40 12 49 12 64Z"/></g></g></g></g><rect x="730" y="428" width="654" height="180" rx="12" fill="#FFFFFF"/><g transform="translate(758 467) scale(0.8729077014961945)"><g transform="translate(0 -4)"><path fill="#000000" fill-rule="evenodd" d="M18 18H54V50C54 70 45 82 32 94H110V114H18V80C30 72 34 64 34 54H18Z"/><path fill="#000000" fill-rule="evenodd" d="M74 18H110V50C110 65 103 76 91 82H71V64C83 62 90 58 90 54H74Z"/></g><g transform="translate(180 8)"><g transform="scale(1.015 1)"><g transform="translate(0 0)"><path fill="#000000" fill-rule="evenodd" d="M0 100V0H35C59 0 72 13 72 32C72 47 64 57 51 61L76 100H58L34 64H12V100Z M12 13V51H33C49 51 57 45 57 32C57 19 49 13 33 13Z"/></g><g transform="translate(88 0)"><path fill="#000000" fill-rule="evenodd" d="M67 69H12C16 82 24 89 37 89C47 89 53 86 59 80L67 90C59 98 49 102 36 102C13 102 0 87 0 64C0 42 14 27 35 27C55 27 67 41 67 62Z M12 57H53C51 45 45 39 35 39C24 39 17 46 12 57Z"/></g><g transform="translate(166 0)"><path fill="#000000" fill-rule="evenodd" d="M65 40L53 50C49 43 43 40 35 40C22 40 12 49 12 64C12 80 22 89 35 89C43 89 49 85 53 78L65 87C58 97 48 102 34 102C13 102 0 87 0 64C0 42 14 27 35 27C48 27 59 32 65 40Z"/></g><g transform="translate(242 0)"><path fill="#000000" fill-rule="evenodd" d="M52 100V91C46 98 38 102 28 102C10 102 0 89 0 65C0 42 12 27 30 27C40 27 47 31 52 38V29H66V100Z M12 65C12 80 21 89 32 89C44 89 52 79 52 65C52 50 44 40 32 40C21 40 12 49 12 65Z"/></g><g transform="translate(320 0)"><path fill="#000000" fill-rule="evenodd" d="M0 0H12V80C12 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(358 0)"><path fill="#000000" fill-rule="evenodd" d="M0 0H12V80C12 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(396 0)"><path fill="#000000" fill-rule="evenodd" d="M0 64C0 42 14 27 35 27C56 27 70 42 70 64C70 87 56 102 35 102C14 102 0 87 0 64Z M12 64C12 80 22 89 35 89C48 89 58 80 58 64C58 49 48 40 35 40C22 40 12 49 12 64Z"/></g></g></g></g><text x="76" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C3E2D">SMALL-SIZE SYSTEM / native pixel sizes</text><g transform="translate(80 674) scale(1.0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M2 2H6V6C6 8 5 9.5 4 11H14V14H2V10C3.5 9 4 8 4 6H2Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M10 2H14V6C14 8 13 9 11 9H9V7C10.5 7 12 6.5 12 6H10Z"/></g><text x="80" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">16px</text><g transform="translate(200 674) scale(0.1875)"><path fill="#2C3E2D" fill-rule="evenodd" d="M18 18H54V50C54 70 45 82 32 94H110V114H18V80C30 72 34 64 34 54H18Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M74 18H110V50C110 65 103 76 91 82H71V64C83 62 90 58 90 54H74Z"/></g><text x="200" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">24px</text><g transform="translate(320 674) scale(1.0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M4 4H14V12C14 18 11 20 8 24H28V28H4V20C8 18 8 16 8 14H4Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M18 4H28V12C28 16 26 19 23 20H18V16C21 16 22 14 22 14H18Z"/></g><text x="320" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">32px</text><g transform="translate(440 674) scale(0.5)"><path fill="#2C3E2D" fill-rule="evenodd" d="M18 18H54V50C54 70 45 82 32 94H110V114H18V80C30 72 34 64 34 54H18Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M74 18H110V50C110 65 103 76 91 82H71V64C83 62 90 58 90 54H74Z"/></g><text x="440" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">64px</text><text x="56" y="840" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Construction &amp; lettering</text><text x="56" y="877" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">Two offset quotation forms and a retained baseline.</text><text x="56" y="904" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">The second tail ends above the baseline, leaving an</text><text x="56" y="931" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">intentional open interval.</text><text x="56" y="1000" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">Soft humanist lettering; wider apertures and a short-</text><text x="56" y="1027" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">footed R.</text><text x="56" y="1092" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Optical cut</text><text x="56" y="1127" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">The 16px cut removes the second tail curve and opens</text><text x="56" y="1154" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">the gap above the baseline to 2px. Both quote heads</text><text x="56" y="1181" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">remain 4px wide.</text><text x="56" y="1270" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Where it gives ground</text><text x="56" y="1307" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">Quotation marks are familiar editorial material.</text><text x="56" y="1334" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">Recognition depends on the retained baseline, not on</text><text x="56" y="1361" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">quotation marks alone.</text><g transform="translate(800 714)"><rect x="0" y="0" width="512" height="512" rx="104" fill="#2C3E2D"/><g transform="translate(53.76 50.76) scale(3.16)"><path fill="#F3F8EF" fill-rule="evenodd" d="M18 18H54V50C54 70 45 82 32 94H110V114H18V80C30 72 34 64 34 54H18Z"/><path fill="#F3F8EF" fill-rule="evenodd" d="M74 18H110V50C110 65 103 76 91 82H71V64C83 62 90 58 90 54H74Z"/></g></g><text x="800" y="1264" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Application icon / actual 512 × 512 drawing</text><text x="800" y="1310" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Clear space: at least one stem-width.</text><text x="800" y="1340" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Full lockup minimum: 140px wide.</text><text x="800" y="1370" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Below 140px: standalone symbol, not the wordmark.</text><path d="M56 1450h1328" stroke="#CCD5C7"/><text x="56" y="1492" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#2C3E2D">Editorial score — not a user-research or trademark result</text><text x="1130" y="1493" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="600" fill="#2C3E2D">78 / 100</text></svg>
