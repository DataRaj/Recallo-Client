rule="evenodd" d="M6 37C14 28 23 24 35 24C56 24 67 35 67 54V88C67 95 69 97 75 97V102H56L54 92C47 99 39 103 27 103C10 103 0 92 0 77C0 62 12 52 33 52H53V49C53 37 47 32 34 32C23 32 17 38 14 46Z M53 60H34C20 60 13 66 13 77C13 89 20 96 31 96C44 96 53 85 53 71Z"/></g><g transform="translate(321 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M-5 0H15V90C15 95 18 97 25 97H32V104H-5V98H2V9L-5 6Z"/></g><g transform="translate(361 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M-5 0H15V90C15 95 18 97 25 97H32V104H-5V98H2V9L-5 6Z"/></g><g transform="translate(401 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M0 64C0 41 14 27 35 27C56 27 70 41 70 64C70 87 56 102 35 102C14 102 0 87 0 64Z M13 64C13 85 21 94 35 94C49 94 57 85 57 64C57 44 49 35 35 35C21 35 13 44 13 64Z"/></g><path fill="#F3F8EF" fill-rule="evenodd" d="M325 98H385V104H325Z"/></g></g></g><rect x="730" y="428" width="654" height="180" rx="12" fill="#FFFFFF"/><g transform="translate(758 467) scale(0.8755760368663594)"><g transform="translate(0 -4)"><path fill="#000000" fill-rule="evenodd" d="M18 14H46V91C46 96 49 98 55 98H65V114H18V101H27V28H18Z"/><path fill="#000000" fill-rule="evenodd" d="M64 14H91V91C91 96 94 98 100 98H112V114H57V101H72V28H64Z"/></g><g transform="translate(180 8)"><g transform="scale(1 1)"><g transform="translate(0 0)"><path fill="#000000" fill-rule="evenodd" d="M-5 0H36C60 0 73 12 73 30C73 46 65 55 50 60L72 94L80 97V101H58L33 62H15V95L24 98V102H-5V98L2 95V7L-5 4Z M15 9V53H32C50 53 59 45 59 30C59 16 50 9 34 9Z"/></g><g transform="translate(86 0)"><path fill="#000000" fill-rule="evenodd" d="M67 69H13C16 82 24 89 37 89C47 89 53 86 59 80L67 90C59 98 49 102 36 102C13 102 0 87 0 64C0 42 14 27 35 27C55 27 67 41 67 62Z M13 57H53C51 45 45 39 35 39C24 39 17 46 13 57Z"/></g><g transform="translate(162 0)"><path fill="#000000" fill-rule="evenodd" d="M65 37L57 52H52C48 40 42 35 32 35C18 35 13 46 13 64C13 84 21 94 35 94C45 94 53 89 60 80L67 86C60 97 49 103 34 103C13 103 0 87 0 64C0 41 14 27 35 27C47 27 57 31 65 37Z"/></g><g transform="translate(236 0)"><path fill="#000000" fill-rule="evenodd" d="M6 37C14 28 23 24 35 24C56 24 67 35 67 54V88C67 95 69 97 75 97V102H56L54 92C47 99 39 103 27 103C10 103 0 92 0 77C0 62 12 52 33 52H53V49C53 37 47 32 34 32C23 32 17 38 14 46Z M53 60H34C20 60 13 66 13 77C13 89 20 96 31 96C44 96 53 85 53 71Z"/></g><g transform="translate(321 0)"><path fill="#000000" fill-rule="evenodd" d="M-5 0H15V90C15 95 18 97 25 97H32V104H-5V98H2V9L-5 6Z"/></g><g transform="translate(361 0)"><path fill="#000000" fill-rule="evenodd" d="M-5 0H15V90C15 95 18 97 25 97H32V104H-5V98H2V9L-5 6Z"/></g><g transform="translate(401 0)"><path fill="#000000" fill-rule="evenodd" d="M0 64C0 41 14 27 35 27C56 27 70 41 70 64C70 87 56 102 35 102C14 102 0 87 0 64Z M13 64C13 85 21 94 35 94C49 94 57 85 57 64C57 44 49 35 35 35C21 35 13 44 13 64Z"/></g><path fill="#000000" fill-rule="evenodd" d="M325 98H385V104H325Z"/></g></g></g><text x="76" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C3E2D">SMALL-SIZE SYSTEM / native pixel sizes</text><g transform="translate(80 674) scale(1.0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M2 2H6V11H8V14H2V12H3V4H2Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M8 2H12V11H14V14H7V12H9V4H8Z"/></g><text x="80" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">16px</text><g transform="translate(200 674) scale(0.1875)"><path fill="#2C3E2D" fill-rule="evenodd" d="M18 14H46V91C46 96 49 98 55 98H65V114H18V101H27V28H18Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M64 14H91V91C91 96 94 98 100 98H112V114H57V101H72V28H64Z"/></g><text x="200" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">24px</text><g transform="translate(320 674) scale(1.0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M4 4H12V23C12 24 12 24 14 24H16V28H4V25H7V7H4Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M16 4H23V23C23 24 24 24 25 24H28V28H14V25H18V7H16Z"/></g><text x="320" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">32px</text><g transform="translate(440 674) scale(0.5)"><path fill="#2C3E2D" fill-rule="evenodd" d="M18 14H46V91C46 96 49 98 55 98H65V114H18V101H27V28H18Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M64 14H91V91C91 96 94 98 100 98H112V114H57V101H72V28H64Z"/></g><text x="440" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">64px</text><text x="56" y="840" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Construction &amp; lettering</text><text x="56" y="877" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">Two ascenders share a stepped foot. Small head serifs</text><text x="56" y="904" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">distinguish the stems; the lower rail continues the</text><text x="56" y="931" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">wordmark’s reading baseline.</text><text x="56" y="1000" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">Original low-contrast serif lettering, linked l feet</text><text x="56" y="1027" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">and a crisp R leg.</text><text x="56" y="1092" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Optical cut</text><text x="56" y="1127" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">Serifs widen to full pixels at 16px; the shared foot</text><text x="56" y="1154" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">is 2–3px deep. Use the serif master from 32px upward,</text><text x="56" y="1181" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">not a scaled full wordmark.</text><text x="56" y="1270" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Where it gives ground</text><text x="56" y="1307" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">The wordmark carries this route. In isolation the</text><text x="56" y="1334" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">symbol may read as II or a small architectural</text><text x="56" y="1361" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">monogram; weaker in a crowded app grid.</text><g transform="translate(800 714)"><rect x="0" y="0" width="512" height="512" rx="104" fill="#2C3E2D"/><g transform="translate(52.48 49.48) scale(3.18)"><path fill="#F3F8EF" fill-rule="evenodd" d="M18 14H46V91C46 96 49 98 55 98H65V114H18V101H27V28H18Z"/><path fill="#F3F8EF" fill-rule="evenodd" d="M64 14H91V91C91 96 94 98 100 98H112V114H57V101H72V28H64Z"/></g></g><text x="800" y="1264" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Application icon / actual 512 × 512 drawing</text><text x="800" y="1310" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Clear space: at least one stem-width.</text><text x="800" y="1340" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Full lockup minimum: 140px wide.</text><text x="800" y="1370" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Below 140px: standalone symbol, not the wordmark.</text><path d="M56 1450h1328" stroke="#CCD5C7"/><text x="56" y="1492" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#2C3E2D">Editorial score — not a user-research or trademark result</text><text x="1130" y="1493" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="600" fill="#2C3E2D">75 / 100</text></svg>
