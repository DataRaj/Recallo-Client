<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1540" viewBox="0 0 1440 1540" role="img" aria-label="Recallo Margin ligature identity sheet"><title>Recallo Margin ligature identity sheet</title><desc></desc><path fill="#F3F8EF" d="M0 0H1440V1540H0Z"/><text x="56" y="66" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="600" fill="#2C3E2D">04 / Margin ligature</text><text x="56" y="103" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Typographic identity</text><text x="56" y="145" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#2C3E2D">Recallo’s double l becomes a shared editorial margin.</text><rect x="56" y="184" width="1328" height="220" rx="12" fill="#E6EEDF"/><g transform="translate(210 204) scale(1.566820276497696)"><g transform="translate(0 -4)"><path fill="#2C3E2D" fill-rule="evenodd" d="M18 14H46V91C46 96 49 98 55 98H65V114H18V101H27V28H18Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M64 14H91V91C91 96 94 98 100 98H112V114H57V101H72V28H64Z"/></g><g transform="translate(180 8)"><g transform="scale(1 1)"><g transform="translate(0 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M-5 0H36C60 0 73 12 73 30C73 46 65 55 50 60L72 94L80 97V101H58L33 62H15V95L24 98V102H-5V98L2 95V7L-5 4Z M15 9V53H32C50 53 59 45 59 30C59 16 50 9 34 9Z"/></g><g transform="translate(86 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M67 69H13C16 82 24 89 37 89C47 89 53 86 59 80L67 90C59 98 49 102 36 102C13 102 0 87 0 64C0 42 14 27 35 27C55 27 67 41 67 62Z M13 57H53C51 45 45 39 35 39C24 39 17 46 13 57Z"/></g><g transform="translate(162 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M65 37L57 52H52C48 40 42 35 32 35C18 35 13 46 13 64C13 84 21 94 35 94C45 94 53 89 60 80L67 86C60 97 49 103 34 103C13 103 0 87 0 64C0 41 14 27 35 27C47 27 57 31 65 37Z"/></g><g transform="translate(236 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M6 37C14 28 23 24 35 24C56 24 67 35 67 54V88C67 95 