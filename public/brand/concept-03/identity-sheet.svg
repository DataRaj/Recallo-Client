48C62 27 70 37 70 51V78C70 93 62 102 48 102H22C8 102 0 93 0 78V51C0 37 8 27 22 27Z M25 41C18 41 16 44 16 51V78C16 85 18 88 25 88H45C52 88 54 85 54 78V51C54 44 52 41 45 41Z"/></g></g></g></g><rect x="730" y="428" width="654" height="180" rx="12" fill="#FFFFFF"/><g transform="translate(758 467) scale(0.9394159140352034)"><g transform="translate(0 -4)"><path fill="#000000" fill-rule="evenodd" d="M18 16H110V78H48V94H110V114H28V58H90V36H18Z"/></g><g transform="translate(180 8)"><g transform="scale(0.94 1)"><g transform="translate(0 0)"><path fill="#000000" fill-rule="evenodd" d="M0 100V0H35C59 0 72 13 72 32C72 47 64 57 51 61L76 100H58L34 64H16V100Z M16 13V51H33C49 51 57 45 57 32C57 19 49 13 33 13Z"/></g><g transform="translate(86 0)"><path fill="#000000" fill-rule="evenodd" d="M67 69H16C16 82 24 89 37 89C47 89 53 86 59 80L67 90C59 98 49 102 36 102C13 102 0 87 0 64C0 42 14 27 35 27C55 27 67 41 67 62Z M16 57H53C51 45 45 39 35 39C24 39 17 46 16 57Z"/></g><g transform="translate(162 0)"><path fill="#000000" fill-rule="evenodd" d="M65 40L53 50C49 43 43 40 35 40C22 40 16 49 16 64C16 80 22 89 35 89C43 89 49 85 53 78L65 87C58 97 48 102 34 102C13 102 0 87 0 64C0 42 14 27 35 27C48 27 59 32 65 40Z"/></g><g transform="translate(236 0)"><path fill="#000000" fill-rule="evenodd" d="M52 100V91C46 98 38 102 28 102C10 102 0 89 0 65C0 42 12 27 30 27C40 27 47 31 52 38V29H66V100Z M16 65C16 80 21 89 32 89C44 89 52 79 52 65C52 50 44 40 32 40C21 40 16 49 16 65Z"/></g><g transform="translate(312 0)"><path fill="#000000" fill-rule="evenodd" d="M0 0H16V85H29V100H0Z"/></g><g transform="translate(348 0)"><path fill="#000000" fill-rule="evenodd" d="M0 0H16V85H29V100H0Z"/></g><g transform="translate(384 0)"><path fill="#000000" fill-rule="evenodd" d="M22 27H48C62 27 70 37 70 51V78C70 93 62 102 48 102H22C8 102 0 93 0 78V51C0 37 8 27 22 27Z M25 41C18 41 16 44 16 51V78C16 85 18 88 25 88H45C52 88 54 85 54 78V51C54 44 52 41 45 41Z"/></g></g></g></g><text x="76" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C3E2D">SMALL-SIZE SYSTEM / native pixel sizes</text><g transform="translate(80 674) scale(1.0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M2 2H14V9H7V11H14V14H3V6H11V5H2Z"/></g><text x="80" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">16px</text><g transform="translate(200 674) scale(0.1875)"><path fill="#2C3E2D" fill-rule="evenodd" d="M18 16H110V78H48V94H110V114H28V58H90V36H18Z"/></g><text x="200" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">24px</text><g transform="translate(320 674) scale(1.0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M4 4H28V20H12V24H28V28H7V14H22V9H4Z"/></g><text x="320" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">32px</text><g transform="translate(440 674) scale(0.5)"><path fill="#2C3E2D" fill-rule="evenodd" d="M18 16H110V78H48V94H110V114H28V58H90V36H18Z"/></g><text x="440" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">64px</text><text x="56" y="840" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Construction &amp; lettering</text><text x="56" y="877" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">A single filled contour with two opposing right-angle</text><text x="56" y="904" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">returns. A 20-unit channel separates the passes; no</text><text x="56" y="931" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">arrowhead, loop or implied playback button.</text><text x="56" y="1000" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">Square-shouldered grotesk; clipped e aperture and firm</text><text x="56" y="1027" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">horizontal rhythm.</text><text x="56" y="1092" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Optical cut</text><text x="56" y="1127" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">The 16px cut uses a 3px band and a minimum 1px</text><text x="56" y="1154" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">channel, aligned to a 16px grid. At 32px it uses the</text><text x="56" y="1181" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">fuller master proportions.</text><text x="56" y="1270" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Where it gives ground</text><text x="56" y="1307" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">Can be read as a numeral 2, an abstract S or a route.</text><text x="56" y="1334" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">Its angularity is more technical than conversational</text><text x="56" y="1361" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">and needs the warmer wordmark beside it.</text><g transform="translate(800 714)"><rect x="0" y="0" width="512" height="512" rx="104" fill="#2C3E2D"/><g transform="translate(53.12 50.12) scale(3.17)"><path fill="#F3F8EF" fill-rule="evenodd" d="M18 16H110V78H48V94H110V114H28V58H90V36H18Z"/></g></g><text x="800" y="1264" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Application icon / actual 512 × 512 drawing</text><text x="800" y="1310" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Clear space: at least one stem-width.</text><text x="800" y="1340" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Full lockup minimum: 140px wide.</text><text x="800" y="1370" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Below 140px: standalone symbol, not the wordmark.</text><path d="M56 1450h1328" stroke="#CCD5C7"/><text x="56" y="1492" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#2C3E2D">Editorial score — not a user-research or trademark result</text><text x="1130" y="1493" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="600" fill="#2C3E2D">83 / 100</text></svg>
