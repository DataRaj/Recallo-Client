<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1540" viewBox="0 0 1440 1540" role="img" aria-label="Recallo Binding fold identity sheet"><title>Recallo Binding fold identity sheet</title><desc></desc><path fill="#F3F8EF" d="M0 0H1440V1540H0Z"/><text x="56" y="66" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="600" fill="#2C3E2D">05 / Binding fold</text><text x="56" y="103" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Wildcard / a physical record</text><text x="56" y="145" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#2C3E2D">A loose strip folds into a bound, retained edge.</text><rect x="56" y="184" width="1328" height="220" rx="12" fill="#E6EEDF"/><g transform="translate(210 204) scale(1.4550226812359135)"><g transform="translate(0 -4)"><path fill="#2C3E2D" fill-rule="evenodd" d="M20 16H52V60L108 30V64L52 94V114H20Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M64 97L108 73V112H64Z"/></g><g transform="translate(180 8)"><g transform="scale(1.09 1)"><g transform="translate(0 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M0 100V0H35C59 0 72 13 72 32C72 47 64 57 51 61L76 100H58L34 64H13V100Z M13 13V51H33C49 51 57 45 57 32C57 19 49 13 33 13Z"/></g><g transform="translate(90 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M67 69H13C16 82 24 89 37 89C47 89 53 86 59 80L67 90C59 98 49 102 36 102C13 102 0 87 0 64C0 42 14 27 35 27C55 27 67 41 67 62Z M13 57H53C51 45 45 39 35 39C24 39 17 46 13 57Z"/></g><g transform="translate(170 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M65 40L53 50C49 43 43 40 35 40C22 40 13 49 13 64C13 80 22 89 35 89C43 89 49 85 53 78L65 87C58 97 48 102 34 102C13 102 0 87 0 64C0 42 14 27 35 27C48 27 59 32 65 40Z"/></g><g transform="translate(248 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M52 100V91C46 98 38 102 28 102C10 102 0 89 0 65C0 42 12 27 30 27C40 27 47 31 52 38V29H66V100Z M13 65C13 80 21 89 32 89C44 89 52 79 52 65C52 50 44 40 32 40C21 40 13 49 13 65Z"/></g><g transform="translate(328 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M0 0H13V80C13 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(368 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M0 0H13V80C13 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(408 0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M0 64C0 42 14 27 35 27C56 27 70 42 70 64C70 87 56 102 35 102C14 102 0 87 0 64Z M13 64C13 80 22 89 35 89C48 89 57 80 57 64C57 49 48 40 35 40C22 40 13 49 13 64Z"/></g></g></g></g><rect x="56" y="428" width="650" height="180" rx="12" fill="#171D1A"/><g transform="translate(84 467) scale(0.8131009101024222)"><g transform="translate(0 -4)"><path fill="#F3F8EF" fill-rule="evenodd" d="M20 16H52V60L108 30V64L52 94V114H20Z"/><path fill="#F3F8EF" fill-rule="evenodd" d="M64 97L108 73V112H64Z"/></g><g transform="translate(180 8)"><g transform="scale(1.09 1)"><g transform="translate(0 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M0 100V0H35C59 0 72 13 72 32C72 47 64 57 51 61L76 100H58L34 64H13V100Z M13 13V51H33C49 51 57 45 57 32C57 19 49 13 33 13Z"/></g><g transform="translate(90 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M67 69H13C16 82 24 89 37 89C47 89 53 86 59 80L67 90C59 98 49 102 36 102C13 102 0 87 0 64C0 42 14 27 35 27C55 27 67 41 67 62Z M13 57H53C51 45 45 39 35 39C24 39 17 46 13 57Z"/></g><g transform="translate(170 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M65 40L53 50C49 43 43 40 35 40C22 40 13 49 13 64C13 80 22 89 35 89C43 89 49 85 53 78L65 87C58 97 48 102 34 102C13 102 0 87 0 64C0 42 14 27 35 27C48 27 59 32 65 40Z"/></g><g transform="translate(248 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M52 100V91C46 98 38 102 28 102C10 102 0 89 0 65C0 42 12 27 30 27C40 27 47 31 52 38V29H66V100Z M13 65C13 80 21 89 32 89C44 89 52 79 52 65C52 50 44 40 32 40C21 40 13 49 13 65Z"/></g><g transform="translate(328 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M0 0H13V80C13 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(368 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M0 0H13V80C13 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(408 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M0 64C0 42 14 27 35 27C56 27 70 42 70 64C70 87 56 102 35 102C14 102 0 87 0 64Z M13 64C13 80 22 89 35 89C48 89 57 80 57 64C57 49 48 40 35 40C22 40 13 49 13 64Z"/></g></g></g></g><rect x="730" y="428" width="654" height="180" rx="12" fill="#FFFFFF"/><g transform="translate(758 467) scale(0.8131009101024222)"><g transform="translate(0 -4)"><path fill="#000000" fill-rule="evenodd" d="M20 16H52V60L108 30V64L52 94V114H20Z"/><path fill="#000000" fill-rule="evenodd" d="M64 97L108 73V112H64Z"/></g><g transform="translate(180 8)"><g transform="scale(1.09 1)"><g transform="translate(0 0)"><path fill="#000000" fill-rule="evenodd" d="M0 100V0H35C59 0 72 13 72 32C72 47 64 57 51 61L76 100H58L34 64H13V100Z M13 13V51H33C49 51 57 45 57 32C57 19 49 13 33 13Z"/></g><g transform="translate(90 0)"><path fill="#000000" fill-rule="evenodd" d="M67 69H13C16 82 24 89 37 89C47 89 53 86 59 80L67 90C59 98 49 102 36 102C13 102 0 87 0 64C0 42 14 27 35 27C55 27 67 41 67 62Z M13 57H53C51 45 45 39 35 39C24 39 17 46 13 57Z"/></g><g transform="translate(170 0)"><path fill="#000000" fill-rule="evenodd" d="M65 40L53 50C49 43 43 40 35 40C22 40 13 49 13 64C13 80 22 89 35 89C43 89 49 85 53 78L65 87C58 97 48 102 34 102C13 102 0 87 0 64C0 42 14 27 35 27C48 27 59 32 65 40Z"/></g><g transform="translate(248 0)"><path fill="#000000" fill-rule="evenodd" d="M52 100V91C46 98 38 102 28 102C10 102 0 89 0 65C0 42 12 27 30 27C40 27 47 31 52 38V29H66V100Z M13 65C13 80 21 89 32 89C44 89 52 79 52 65C52 50 44 40 32 40C21 40 13 49 13 65Z"/></g><g transform="translate(328 0)"><path fill="#000000" fill-rule="evenodd" d="M0 0H13V80C13 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(368 0)"><path fill="#000000" fill-rule="evenodd" d="M0 0H13V80C13 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(408 0)"><path fill="#000000" fill-rule="evenodd" d="M0 64C0 42 14 27 35 27C56 27 70 42 70 64C70 87 56 102 35 102C14 102 0 87 0 64Z M13 64C13 80 22 89 35 89C48 89 57 80 57 64C57 49 48 40 35 40C22 40 13 49 13 64Z"/></g></g></g></g><text x="76" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C3E2D">SMALL-SIZE SYSTEM / native pixel sizes</text><g transform="translate(80 674) scale(1.0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M2 2H6V7L14 3V7L6 11V14H2Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M8 12L14 9V14H8Z"/></g><text x="80" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">16px</text><g transform="translate(200 674) scale(0.1875)"><path fill="#2C3E2D" fill-rule="evenodd" d="M20 16H52V60L108 30V64L52 94V114H20Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M64 97L108 73V112H64Z"/></g><text x="200" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">24px</text><g transform="translate(320 674) scale(1.0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M5 4H13V15L27 8V16L13 24V28H5Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M16 24L27 18V28H16Z"/></g><text x="320" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">32px</text><g transform="translate(440 674) scale(0.5)"><path fill="#2C3E2D" fill-rule="evenodd" d="M20 16H52V60L108 30V64L52 94V114H20Z"/><path fill="#2C3E2D" fill-rule="evenodd" d="M64 97L108 73V112H64Z"/></g><text x="440" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">64px</text><text x="56" y="840" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Construction &amp; lettering</text><text x="56" y="877" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">A vertical spine supports a rising flap and a</text><text x="56" y="904" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">separated lower fold. The diagonal seam is structural</text><text x="56" y="931" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">and remains open in one color.</text><text x="56" y="1000" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">Expanded lettering with an upright R and broad, quiet</text><text x="56" y="1027" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">rounded counters.</text><text x="56" y="1092" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Optical cut</text><text x="56" y="1127" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">The 16px cut makes the fold seam at least 1px, widens</text><text x="56" y="1154" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">the spine to 4px and squares the lower flap. No</text><text x="56" y="1181" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">decorative crease line is used.</text><text x="56" y="1270" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Where it gives ground</text><text x="56" y="1307" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">A folded-strip reading needs introduction; some</text><text x="56" y="1334" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">viewers may see a flag or K. Avoid adding more folds</text><text x="56" y="1361" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">or trying to hide another letter.</text><g transform="translate(800 714)"><rect x="0" y="0" width="512" height="512" rx="104" fill="#2C3E2D"/><g transform="translate(51.20 48.20) scale(3.2)"><path fill="#F3F8EF" fill-rule="evenodd" d="M20 16H52V60L108 30V64L52 94V114H20Z"/><path fill="#F3F8EF" fill-rule="evenodd" d="M64 97L108 73V112H64Z"/></g></g><text x="800" y="1264" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Application icon / actual 512 × 512 drawing</text><text x="800" y="1310" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Clear space: at least one stem-width.</text><text x="800" y="1340" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Full lockup minimum: 140px wide.</text><text x="800" y="1370" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Below 140px: standalone symbol, not the wordmark.</text><path d="M56 1450h1328" stroke="#CCD5C7"/><text x="56" y="1492" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#2C3E2D">Editorial score — not a user-research or trademark result</text><text x="1130" y="1493" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="600" fill="#2C3E2D">80 / 100</text></svg>
