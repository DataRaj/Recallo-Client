 fill-rule="evenodd" d="M0 0H14V80C14 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(348 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M0 0H14V80C14 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(384 0)"><path fill="#F3F8EF" fill-rule="evenodd" d="M0 64C0 42 14 27 35 27C56 27 70 42 70 64C70 87 56 102 35 102C14 102 0 87 0 64Z M14 64C14 80 22 89 35 89C48 89 56 80 56 64C56 49 48 40 35 40C22 40 14 49 14 64Z"/></g></g></g></g><rect x="730" y="428" width="654" height="180" rx="12" fill="#FFFFFF"/><g transform="translate(758 467) scale(0.8990536277602523)"><g transform="translate(0 -4)"><path fill="#000000" fill-rule="evenodd" d="M18 116V14H65C94 14 110 28 110 49C110 65 102 77 86 82L105 101H114V118H90L58 84H39V116Z M39 33V65H64C80 65 89 60 89 49C89 38 80 33 64 33Z"/></g><g transform="translate(180 8)"><g transform="scale(1 1)"><g transform="translate(0 0)"><path fill="#000000" fill-rule="evenodd" d="M0 100V0H35C59 0 72 13 72 32C72 47 64 57 51 61L68 85H78V100H59L34 64H14V100Z M14 13V51H33C49 51 57 45 57 32C57 19 49 13 33 13Z"/></g><g transform="translate(86 0)"><path fill="#000000" fill-rule="evenodd" d="M67 69H14C16 82 24 89 37 89C47 89 53 86 59 80L67 90C59 98 49 102 36 102C13 102 0 87 0 64C0 42 14 27 35 27C55 27 67 41 67 62Z M14 57H53C51 45 45 39 35 39C24 39 17 46 14 57Z"/></g><g transform="translate(162 0)"><path fill="#000000" fill-rule="evenodd" d="M65 40L53 50C49 43 43 40 35 40C22 40 14 49 14 64C14 80 22 89 35 89C43 89 49 85 53 78L65 87C58 97 48 102 34 102C13 102 0 87 0 64C0 42 14 27 35 27C48 27 59 32 65 40Z"/></g><g transform="translate(236 0)"><path fill="#000000" fill-rule="evenodd" d="M52 100V91C46 98 38 102 28 102C10 102 0 89 0 65C0 42 12 27 30 27C40 27 47 31 52 38V29H66V100Z M14 65C14 80 21 89 32 89C44 89 52 79 52 65C52 50 44 40 32 40C21 40 14 49 14 65Z"/></g><g transform="translate(312 0)"><path fill="#000000" fill-rule="evenodd" d="M0 0H14V80C14 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(348 0)"><path fill="#000000" fill-rule="evenodd" d="M0 0H14V80C14 86 17 89 23 89H28V100H20C6 100 0 93 0 80Z"/></g><g transform="translate(384 0)"><path fill="#000000" fill-rule="evenodd" d="M0 64C0 42 14 27 35 27C56 27 70 42 70 64C70 87 56 102 35 102C14 102 0 87 0 64Z M14 64C14 80 22 89 35 89C48 89 56 80 56 64C56 49 48 40 35 40C22 40 14 49 14 64Z"/></g></g></g></g><text x="76" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C3E2D">SMALL-SIZE SYSTEM / native pixel sizes</text><g transform="translate(80 674) scale(1.0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M2 14V2H8C11 2 13 3.5 13 6C13 8 12 9 10 10L13 12H14V15H11L7 10H5V14Z M5 4V7.5H8C9.5 7.5 10 7 10 6C10 4.5 9 4 8 4Z"/></g><text x="80" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">16px</text><g transform="translate(200 674) scale(0.1875)"><path fill="#2C3E2D" fill-rule="evenodd" d="M18 116V14H65C94 14 110 28 110 49C110 65 102 77 86 82L105 101H114V118H90L58 84H39V116Z M39 33V65H64C80 65 89 60 89 49C89 38 80 33 64 33Z"/></g><text x="200" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">24px</text><g transform="translate(320 674) scale(1.0)"><path fill="#2C3E2D" fill-rule="evenodd" d="M4 29V4H16C24 4 28 7 28 12C28 16 26 19 22 20L26 25H28V30H22L14 21H10V29Z M10 8V16H16C20 16 22 15 22 12C22 10 20 8 16 8Z"/></g><text x="320" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">32px</text><g transform="translate(440 674) scale(0.5)"><path fill="#2C3E2D" fill-rule="evenodd" d="M18 116V14H65C94 14 110 28 110 49C110 65 102 77 86 82L105 101H114V118H90L58 84H39V116Z M39 33V65H64C80 65 89 60 89 49C89 38 80 33 64 33Z"/></g><text x="440" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#2C3E2D">64px</text><text x="56" y="840" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Construction &amp; lettering</text><text x="56" y="877" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">21-unit stem; 19-unit shoulder; open 31-unit counter.</text><text x="56" y="904" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">The leg returns to a horizontal terminal, rather than</text><text x="56" y="931" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">ending in a generic diagonal.</text><text x="56" y="1000" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">Compact grotesk; open e, single-storey a, returning R</text><text x="56" y="1027" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">foot.</text><text x="56" y="1092" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Optical cut</text><text x="56" y="1127" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">The 16px cut thickens the counter floor and widens its</text><text x="56" y="1154" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">opening. The returning foot becomes a square hook; no</text><text x="56" y="1181" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">rounded subpixel tip.</text><text x="56" y="1270" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" fill="#2C3E2D">Where it gives ground</text><text x="56" y="1307" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">The R category is crowded. The returning foot is less</text><text x="56" y="1334" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">apparent at 16px; the master is deliberately</text><text x="56" y="1361" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#2C3E2D">simplified there.</text><g transform="translate(800 714)"><rect x="0" y="0" width="512" height="512" rx="104" fill="#2C3E2D"/><g transform="translate(57.60 54.60) scale(3.1)"><path fill="#F3F8EF" fill-rule="evenodd" d="M18 116V14H65C94 14 110 28 110 49C110 65 102 77 86 82L105 101H114V118H90L58 84H39V116Z M39 33V65H64C80 65 89 60 89 49C89 38 80 33 64 33Z"/></g></g><text x="800" y="1264" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Application icon / actual 512 × 512 drawing</text><text x="800" y="1310" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Clear space: at least one stem-width.</text><text x="800" y="1340" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Full lockup minimum: 140px wide.</text><text x="800" y="1370" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E2D">Below 140px: standalone symbol, not the wordmark.</text><path d="M56 1450h1328" stroke="#CCD5C7"/><text x="56" y="1492" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#2C3E2D">Editorial score — not a user-research or trademark result</text><text x="1130" y="1493" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="600" fill="#2C3E2D">89 / 100</text></svg>
